<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montage Design System - Dashboard Mockup</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <style>
        :root {
            /* Semantic Colors (Based on Montage) */
            --semantic-primary-normal: #2b5ff1;
            --semantic-primary-strong: #1b4fd8;
            --semantic-background-normal: #f8f9fa;
            --semantic-background-elevated: #ffffff;
            --semantic-label-strong: #111111;
            --semantic-label-normal: #333333;
            --semantic-label-alternative: #666666;
            --semantic-line-normal: #e9ecef;
            --semantic-status-positive: #27ae60;

            /* Elevation */
            --elevation-shadow-small: 0px 2px 4px -2px rgba(17, 17, 17, 0.06), 0px 4px 6px -1px rgba(17, 17, 17, 0.06);
            --elevation-shadow-medium: 0px 4px 6px -2px rgba(17, 17, 17, 0.07), 0px 10px 15px -3px rgba(17, 17, 17, 0.07);

            /* Typography */
            --font-family: 'Pretendard', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--semantic-background-normal);
            color: var(--semantic-label-normal);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography Classes */
        .title2 { font-size: 1.75rem; line-height: 2.375rem; font-weight: 700; letter-spacing: -0.0236em; color: var(--semantic-label-strong); }
        .title3 { font-size: 1.5rem; line-height: 2rem; font-weight: 700; letter-spacing: -0.023em; color: var(--semantic-label-strong); }
        .heading2 { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; letter-spacing: -0.012em; color: var(--semantic-label-strong); }
        .body1 { font-size: 1rem; line-height: 1.5rem; font-weight: 400; letter-spacing: 0.0057em; }
        .label1 { font-size: 0.875rem; line-height: 1.25rem; font-weight: 600; letter-spacing: 0.0145em; color: var(--semantic-label-alternative); }
        .caption1 { font-size: 0.75rem; line-height: 1rem; font-weight: 400; letter-spacing: 0.0252em; color: var(--semantic-label-alternative); }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--semantic-background-elevated);
            border-right: 1px solid var(--semantic-line-normal);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 32px 8px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background-color: var(--semantic-primary-normal);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--semantic-label-alternative);
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(43, 95, 241, 0.08);
            color: var(--semantic-primary-normal);
        }

        .nav-item.active {
            font-weight: 600;
        }

        /* SVG Icon Utilities */
        .icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            height: 72px;
            background-color: var(--semantic-background-elevated);
            border-bottom: 1px solid var(--semantic-line-normal);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e2e8f0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--semantic-label-alternative);
        }

        .content-body {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Cards Container */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* Elevated Card (Montage Style) */
        .card {
            background-color: var(--semantic-background-elevated);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--elevation-shadow-small);
            border: 1px solid rgba(17, 17, 17, 0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--elevation-shadow-medium);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background-color: rgba(43, 95, 241, 0.1);
            color: var(--semantic-primary-normal);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--semantic-label-strong);
            letter-spacing: -0.028em;
        }

        .stat-change {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--semantic-status-positive);
            background-color: rgba(39, 174, 96, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Table Area */
        .table-section {
            background-color: var(--semantic-background-elevated);
            border-radius: 16px;
            box-shadow: var(--elevation-shadow-small);
            border: 1px solid rgba(17, 17, 17, 0.04);
            overflow: hidden;
        }

        .table-header {
            padding: 24px;
            border-bottom: 1px solid var(--semantic-line-normal);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #fafbfc;
            color: var(--semantic-label-alternative);
            font-weight: 600;
            padding: 16px 24px;
            font-size: 0.8125rem;
            letter-spacing: 0.02em;
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--semantic-line-normal);
            color: var(--semantic-label-normal);
            font-size: 0.9375rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #fcfcfc;
        }

        /* Chip */
        .chip {
            display: inline-flex;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8125rem;
            font-weight: 600;
            background-color: #f1f3f5;
            color: var(--semantic-label-alternative);
        }
        .chip.active {
            background-color: rgba(43, 95, 241, 0.1);
            color: var(--semantic-primary-normal);
        }

        /* Button */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            background-color: var(--semantic-primary-normal);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.9375rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--semantic-primary-strong);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">W</div>
            <div class="heading2">Workspace</div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Dashboard
            </li>
            <li class="nav-item">
                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Projects
            </li>
            <li class="nav-item">
                <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Team
            </li>
            <li class="nav-item">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="search" style="color: var(--semantic-label-alternative); display:flex; align-items:center; gap: 8px;">
                <svg class="icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="body1">Search...</span>
            </div>
            <div style="display:flex; align-items:center; gap: 24px;">
                <svg class="icon" style="color: var(--semantic-label-alternative)" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <div class="avatar">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
            </div>
        </header>

        <!-- Body -->
        <div class="content-body">
            <div style="display:flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="title2">안녕하세요, 홍길동님 👋</h1>
                    <p class="body1" style="color: var(--semantic-label-alternative); margin-top: 8px;">오늘의 업무 현황을 확인해 보세요.</p>
                </div>
                <button class="btn">새 프로젝트 생성</button>
            </div>

            <!-- Stats Grid -->
            <div class="grid-cards">
                <div class="card">
                    <div class="card-header">
                        <span class="label1">총 방문자 수</span>
                        <div class="card-icon">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        </div>
                    </div>
                    <div>
                        <div class="stat-value">24,592</div>
                        <div style="margin-top: 12px; display:flex; align-items:center; gap: 8px;">
                            <span class="stat-change caption1">
                                <svg class="icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                                12.5%
                            </span>
                            <span class="caption1">지난 달 대비</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="label1">신규 전환율</span>
                        <div class="card-icon">
                            <svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        </div>
                    </div>
                    <div>
                        <div class="stat-value">4.2%</div>
                        <div style="margin-top: 12px; display:flex; align-items:center; gap: 8px;">
                            <span class="stat-change caption1" style="color: #e74c3c; background-color: rgba(231, 76, 60, 0.1);">
                                <svg class="icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
                                1.2%
                            </span>
                            <span class="caption1">지난 달 대비</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="label1">총 매출</span>
                        <div class="card-icon">
                            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                        </div>
                    </div>
                    <div>
                        <div class="stat-value">₩12.4M</div>
                        <div style="margin-top: 12px; display:flex; align-items:center; gap: 8px;">
                            <span class="stat-change caption1">
                                <svg class="icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                                8.4%
                            </span>
                            <span class="caption1">지난 달 대비</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-section">
                <div class="table-header">
                    <h3 class="title3">최근 활동 내역</h3>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>프로젝트 명</th>
                            <th>담당자</th>
                            <th>상태</th>
                            <th>최종 업데이트</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: 500;">디자인 시스템 리뉴얼</td>
                            <td>
                                <div style="display:flex; align-items:center; gap: 12px;">
                                    <div class="avatar" style="width: 24px; height: 24px; font-size: 10px;">홍</div>
                                    홍길동
                                </div>
                            </td>
                            <td><span class="chip active">진행중</span></td>
                            <td style="color: var(--semantic-label-alternative);">2시간 전</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 500;">온보딩 프로세스 개선</td>
                            <td>
                                <div style="display:flex; align-items:center; gap: 12px;">
                                    <div class="avatar" style="width: 24px; height: 24px; font-size: 10px;">김</div>
                                    김철수
                                </div>
                            </td>
                            <td><span class="chip">대기중</span></td>
                            <td style="color: var(--semantic-label-alternative);">어제</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 500;">신규 랜딩 페이지 배포</td>
                            <td>
                                <div style="display:flex; align-items:center; gap: 12px;">
                                    <div class="avatar" style="width: 24px; height: 24px; font-size: 10px;">이</div>
                                    이영희
                                </div>
                            </td>
                            <td><span class="chip" style="background-color: rgba(39, 174, 96, 0.1); color: var(--semantic-status-positive);">완료</span></td>
                            <td style="color: var(--semantic-label-alternative);">3일 전</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

</body>
</html>
